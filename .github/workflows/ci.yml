name: Kredit CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache Compact compiler
        id: cache-compact
        uses: actions/cache@v4
        with:
          path: ~/.compact
          key: compact-0.31.1

      - name: Install Compact toolchain
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          compact update 0.31.1

      - name: Install dependencies
        run: npm install

      - name: Compile contract
        run: npm run compact

      - name: Typecheck
        run: |
          cd contract && npx tsc --noEmit
          cd ../api && npx tsc --noEmit

      - name: Privacy check
        run: |
          if grep -r "privateState" frontend/app/api/ 2>/dev/null; then
            echo "ERROR: privateState found in API routes — privacy violation!"
            exit 1
          fi
          echo "Privacy check passed: no private witness data in API routes"

      - name: Run tests
        run: npm test

      - name: Save test output
        if: always()
        run: npm test > test-output.txt 2>&1 || true

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test-output.txt

      - name: Build contract
        run: cd contract && npm run build

      - name: Build API
        run: cd api && npm run build

      - name: Build frontend
        run: cd frontend && npm run build
